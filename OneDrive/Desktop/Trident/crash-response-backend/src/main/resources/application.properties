spring.application.name=crash-response-backend

# Server Configuration
server.port=8080

# PostgreSQL Connection (Docker environment variables with local fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vehicle_safety_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:muskan}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret
jwt.secret=${JWT_SECRET:CrashResponseSystemSuperSecretKeyForJWTAuthToken123456}
jwt.expirationMs=86400000

# Fast2SMS Configuration
fast2sms.api.key=${FAST2SMS_API_KEY:jZou6yaHmD2JsWcbn3K4ESB8OtYd0p1CRfrwVzQl5TvekFXgLiEI0LZWOfsg6QobD9NqaUR3lYnxhP2B}
fast2sms.url=https://www.fast2sms.com/dev/bulkV2