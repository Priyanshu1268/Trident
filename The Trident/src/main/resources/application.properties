# =========================================
# Application
# =========================================
spring.application.name=project
server.port=${SERVER_PORT:8080}

# =========================================
# Active profile (dev by default)
# =========================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================================
# Database (MySQL) - values injected via environment variables
# =========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================
# JWT
# =========================================
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================
# CORS
# =========================================
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# =========================================
# Error handling
# =========================================
server.error.include-message=always
server.error.include-binding-errors=always
