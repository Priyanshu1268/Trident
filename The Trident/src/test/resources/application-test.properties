# Self-contained profile used by automated tests: no external MySQL needed.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

application.security.jwt.secret-key=test-secret-key-please-change-1234567890abcdef
application.security.jwt.expiration-ms=3600000

application.cors.allowed-origins=http://localhost:3000
